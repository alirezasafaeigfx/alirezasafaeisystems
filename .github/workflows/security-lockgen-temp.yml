name: Temporary security lock generator

on:
  push:
    branches:
      - chore/security-lockgen-20260904

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout modernization target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chore/security-lighthouse-modernization-20260904
          fetch-depth: 0

      - name: Setup project pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Replace legacy LHCI dependency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          delete pkg.devDependencies['@lhci/cli']
          pkg.devDependencies.lighthouse = '13.4.1'
          pkg.scripts['lighthouse:ci'] = 'node scripts/ci/run-lighthouse-budget.mjs --config=./lighthouserc.json --out-dir artifacts/lighthouse'
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Generate lockfile with project pnpm
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify generated lockfile with project pnpm
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture fail-closed audit evidence
        shell: bash
        run: |
          set +e
          pnpm audit --json > audit.json
          status=$?
          set -e
          printf '%s\n' "$status" > audit-exit.txt
          node <<'NODE'
          const fs = require('node:fs')
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'))
          const meta = audit?.metadata?.vulnerabilities ?? audit?.metadata?.advisories
          if (!meta || typeof meta !== 'object') throw new Error('audit metadata missing')
          const known = ['info', 'low', 'moderate', 'high', 'critical']
          for (const severity of known) {
            const value = Number(meta[severity])
            if (!Number.isInteger(value) || value < 0) throw new Error(`invalid audit count for ${severity}`)
          }
          const unknown = Object.entries(meta)
            .filter(([key]) => !known.includes(key))
            .reduce((sum, [, value]) => sum + (Number.isInteger(Number(value)) && Number(value) >= 0 ? Number(value) : 1), 0)
          const result = { auditExit: Number(fs.readFileSync('audit-exit.txt', 'utf8')), metadata: meta, unknown }
          console.log(JSON.stringify(result, null, 2))
          if (Number(meta.critical) !== 0 || Number(meta.high) !== 0 || unknown !== 0) process.exit(1)
          NODE

      - name: Publish package and lock atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "package.json pnpm-lock.yaml "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore(security): replace legacy LHCI dependency'
          git push origin HEAD:chore/security-lighthouse-modernization-20260904

      - name: Upload generated dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-lockgen-final
          path: |
            package.json
            pnpm-lock.yaml
            audit.json
            audit-exit.txt
          if-no-files-found: error
          retention-days: 1
