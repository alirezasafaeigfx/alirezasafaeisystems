name: E2E Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ai/**'

permissions:
  contents: read

concurrency:
  group: mother-e2e-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium without host package mutation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright install chromium
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm run test:e2e:smoke
      - name: Run accessibility tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright test e2e/a11y.spec.ts
      - name: Run V3.2 public experience acceptance
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PUBLIC_EXPERIENCE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec playwright test e2e/public-experience.spec.mjs
      - name: Upload V3.2 public experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-public-experience-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/public-experience
          if-no-files-found: error
          retention-days: 14
      - name: Run V3.1 visual contract
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: pnpm exec playwright test e2e/public-v31-visual.spec.ts
      - name: Upload V3.1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-visual-evidence-${{ github.sha }}
          path: test-results/v31-evidence
          if-no-files-found: error
          retention-days: 14
